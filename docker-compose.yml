services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ttt
      POSTGRES_PASSWORD: ttt
      POSTGRES_DB: ttt
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttt -d ttt"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  app1:
    build: ./server
    environment:
      INSTANCE_ID: app1
      DATABASE_URL: postgresql://ttt:ttt@postgres:5432/ttt
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: game.events
      DESK_SIZE: ${DESK_SIZE:-3}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  app2:
    build: ./server
    environment:
      INSTANCE_ID: app2
      DATABASE_URL: postgresql://ttt:ttt@postgres:5432/ttt
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: game.events
      DESK_SIZE: ${DESK_SIZE:-3}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "2101:80"
    depends_on:
      - app1
      - app2

volumes:
  pgdata:
